<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CloudNative AWS DevOps Platform</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link
rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow">

<div class="container">

<a class="navbar-brand fw-bold">

<i class="fa-brands fa-aws text-warning"></i>

CloudNative AWS DevOps Platform

</a>

</div>

</nav>

<section class="hero-section">

<div class="container">

<div class="row align-items-center">

<div class="col-lg-6">

<h1 class="display-4 fw-bold">

Production AWS DevOps Project

</h1>

<p class="lead mt-4">

Modern CI/CD platform using
Jenkins, Docker, Kubernetes,
Terraform, Prometheus & Grafana.

</p>

<button class="btn btn-warning btn-lg">

Production Ready

</button>

</div>

<div class="col-lg-6 text-center">

<img
src="https://cdn-icons-png.flaticon.com/512/919/919853.png"
class="img-fluid hero-image">

</div>

</div>

</div>

</section>

<section class="container py-5">

<div class="row g-4">

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body">

<h5>Environment</h5>

<h3>{{ environment }}</h3>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body">

<h5>Hostname</h5>

<h6>{{ hostname }}</h6>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body">

<h5>Platform</h5>

<h6>{{ platform_name }}</h6>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card dashboard-card">

<div class="card-body">

<h5>Status</h5>

<span class="badge bg-success">

Running

</span>

</div>

</div>

</div>

</div>

</section>

<footer class="bg-dark text-white text-center py-4">

<p>

Flask + Jenkins + Docker + EKS + Terraform

</p>

</footer>

</body>

</html>
